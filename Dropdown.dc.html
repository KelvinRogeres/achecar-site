<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/achecar-design-system-2-0-c352d177-15d3-4f15-a854-a6a2a9d7f8be/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/achecar-design-system-2-0-c352d177-15d3-4f15-a854-a6a2a9d7f8be/styles.css">
  <script src="_ds/achecar-design-system-2-0-c352d177-15d3-4f15-a854-a6a2a9d7f8be/_ds_bundle.js"></script>
  <style>@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}</style>
</helmet>
<div data-dd="1" style="position:relative;width:100%;font-family:Roboto,sans-serif;color:#1D2433">
  <button type="button" ref="{{ btnRef }}" onClick="{{ toggle }}" onKeyDown="{{ onKey }}" disabled="{{ disabled }}" aria-haspopup="listbox" aria-expanded="{{ open }}" aria-label="{{ label }}" style="width:100%;height:{{ h }};box-sizing:border-box;border:0;border-radius:8px;background:{{ bg }};box-shadow:{{ ring }};display:flex;align-items:center;gap:8px;padding:0 10px 0 {{ padL }};text-align:left;color:{{ color }};cursor:{{ cursor }};transition:box-shadow .15s ease-out" style-hover="box-shadow:inset 0 0 0 1px #7D3EE3" style-focus-visible="outline:none;box-shadow:inset 0 0 0 1px #7D3EE3, 0 0 0 3px rgba(125,61,227,.35)">
    <sc-if value="{{ hasBrand }}" hint-placeholder-val="{{ false }}"><span style="width:32px;height:32px;flex:none;border-radius:6px;background:#F6F6F9;overflow:hidden;position:relative"><span style="position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%) scale(.55)"><x-import component-from-global-scope="AchecarDesignSystem_c352d1.MarcaSMbolo" brand="{{ brand }}" tone="dark" hint-size="48px,48px"></x-import></span></span></sc-if>
    <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;color:#5A6472;margin-left:2px">{{ icon }}</span></sc-if>
    <span style="flex:1;min-width:0;font:500 {{ fs }} Roboto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><sc-if value="{{ hasPrefix }}" hint-placeholder-val="{{ false }}"><span style="font-weight:400;color:#5A6472">{{ prefix }} </span></sc-if>{{ valueLabel }}</span>
    <span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1;color:{{ chevColor }};transform:{{ rot }};transition:transform .15s ease-out">expand_more</span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div role="listbox" aria-label="{{ label }}" style="position:absolute;top:calc(100% + 6px);left:{{ panelL }};right:{{ panelR }};z-index:45;width:{{ panelW }};min-width:100%;max-width:calc(100vw - 32px);box-sizing:border-box;background:#fff;border-radius:12px;box-shadow:0 16px 40px rgba(29,36,51,.16), inset 0 0 0 1px #E6E6EE;padding:6px;display:flex;flex-direction:column;gap:4px;animation:ddIn .14s ease-out both">
      <sc-if value="{{ search }}" hint-placeholder-val="{{ false }}"><label style="position:relative;height:40px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 10px;margin-bottom:2px;border-radius:8px;box-shadow:inset 0 0 0 1px #E6E6EE;cursor:text" style-focus-within="box-shadow:inset 0 0 0 1px #7D3EE3, 0 0 0 3px rgba(125,61,227,.35)"><span style="pointer-events:none;font-family:'Material Symbols Rounded';font-size:20px;line-height:1;color:#5A6472">search</span><input autoFocus="{{ true }}" value="{{ q }}" onChange="{{ onQ }}" placeholder="{{ searchPh }}" aria-label="{{ searchPh }}" style="flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;font:400 14px Roboto;color:#1D2433"></label></sc-if>
      <div style="max-height:288px;overflow:auto;display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ opts }}" as="o" hint-placeholder-count="5">
          <button type="button" role="option" aria-selected="{{ o.on }}" onClick="{{ o.pick }}" style="flex:none;width:100%;min-height:40px;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:8px;background:{{ o.bg }};text-align:left;color:#1D2433;cursor:pointer;transition:background .12s ease-out" style-hover="background:#F5F4FE">
            <sc-if value="{{ o.hasBrand }}" hint-placeholder-val="{{ false }}"><span style="width:28px;height:28px;flex:none;border-radius:6px;background:#F6F6F9;overflow:hidden;position:relative"><span style="position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%) scale(.48)"><x-import component-from-global-scope="AchecarDesignSystem_c352d1.MarcaSMbolo" brand="{{ o.brand }}" tone="dark" hint-size="48px,48px"></x-import></span></span></sc-if>
            <span style="flex:1;min-width:0;font:{{ o.weight }} 14px Roboto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ o.label }}</span>
            <span style="font:400 12px Roboto;color:#5A6472;white-space:nowrap">{{ o.sub }}</span>
            <span style="width:18px;flex:none;font-family:'Material Symbols Rounded';font-size:18px;line-height:1;color:#7D3EE3">{{ o.check }}</span>
          </button>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><span style="padding:12px 10px;font:400 13px Roboto;color:#5A6472">{{ emptyText }}</span></sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:360},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ano-modelo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ id: string; label: string; sub?: string; brand?: string }[]&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string, option: object) =&gt; void&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;sm&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'md' | 'sm'&quot;},&quot;prefix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;search&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;searchPlaceholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Buscar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emptyText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nenhum resultado.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;left&quot;,&quot;right&quot;],&quot;default&quot;:&quot;left&quot;,&quot;tsType&quot;:&quot;'left' | 'right'&quot;},&quot;panelWidth&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: false, q: "", val: undefined };
  btnRef = React.createRef();
  DEMO = [{ id: "2027", label: "2027", sub: "R$ 194.799" }, { id: "2026", label: "2026", sub: "R$ 184.721" }, { id: "2025", label: "2025", sub: "R$ 170.648" }, { id: "2024", label: "2024", sub: "R$ 155.099" }];
  norm = (x) => (x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  componentDidMount() {
    this._c = (e) => { if (this.state.open && this._root && !this._root.contains(e.target)) this.setState({ open: false, q: "" }); };
    this._k = (e) => { if (e.key === "Escape" && this.state.open) { this.setState({ open: false, q: "" }); this.btnRef.current && this.btnRef.current.focus(); } };
    document.addEventListener("mousedown", this._c); document.addEventListener("keydown", this._k);
    this._root = this.btnRef.current && this.btnRef.current.closest("[data-dd]");
  }
  componentWillUnmount() { document.removeEventListener("mousedown", this._c); document.removeEventListener("keydown", this._k); }
  renderVals() {
    const P = this.props, s = this.state, sm = P.size === "sm";
    const options = P.options && P.options.length ? P.options : this.DEMO;
    const cur = P.value !== undefined ? P.value : (s.val !== undefined ? s.val : options[0].id);
    const sel = options.find((o) => o.id === cur) || options[0];
    const q = this.norm(s.q.trim()), list = q ? options.filter((o) => this.norm(o.label).includes(q)) : options;
    const open = s.open && !P.disabled, right = P.align === "right";
    return {
      btnRef: this.btnRef, open, label: P.label || "Selecionar", disabled: !!P.disabled,
      h: sm ? "44px" : "48px", fs: sm ? "14px" : "15px",
      padL: P.brand ? "8px" : P.icon ? "10px" : "14px",
      bg: P.disabled ? "#F1F1F5" : "#fff", color: P.disabled ? "#8A93A3" : "#1D2433", cursor: P.disabled ? "not-allowed" : "pointer",
      ring: open ? "inset 0 0 0 1px #7D3EE3, 0 0 0 3px rgba(125,61,227,.35)" : "inset 0 0 0 1px #D5D8DE",
      rot: open ? "rotate(180deg)" : "none", chevColor: open ? "#7D3EE3" : "#5A6472",
      hasBrand: !!P.brand, brand: P.brand || "", hasIcon: !!P.icon, icon: P.icon || "",
      hasPrefix: !!P.prefix, prefix: P.prefix || "", valueLabel: sel ? sel.label : "",
      panelW: P.panelWidth || "100%", panelL: right ? "auto" : "0", panelR: right ? "0" : "auto",
      search: !!P.search, searchPh: P.searchPlaceholder || "Buscar", q: s.q, onQ: (e) => this.setState({ q: e.target.value }),
      toggle: () => this.setState((st) => ({ open: !st.open, q: "" })),
      onKey: (e) => { if (e.key === "ArrowDown" && !this.state.open) { e.preventDefault(); this.setState({ open: true }); } },
      opts: list.map((o) => { const on = o.id === cur; return { ...o, sub: o.sub || "", hasBrand: !!o.brand, brand: o.brand || "", on, bg: on ? "#F5F4FE" : "transparent", weight: on ? 700 : 400, check: on ? "check" : "", pick: () => { this.setState({ open: false, q: "", val: o.id }); P.onChange && P.onChange(o.id, o); } }; }),
      empty: !list.length, emptyText: P.emptyText || "Nenhum resultado."
    };
  }
}
</script>
</body>
</html>
